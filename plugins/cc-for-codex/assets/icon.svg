<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CC for Codex</title>
  <desc id="desc">Two code brackets joined by a luminous local bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="24" x2="478" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#080A14"/><stop offset=".54" stop-color="#12152A"/><stop offset="1" stop-color="#24152C"/></linearGradient>
    <linearGradient id="accent" x1="92" y1="256" x2="420" y2="256" gradientUnits="userSpaceOnUse"><stop stop-color="#62B5FF"/><stop offset=".5" stop-color="#9D8BFF"/><stop offset="1" stop-color="#FF8EA6"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 58) rotate(45) scale(390 340)"><stop stop-color="#4D8DFF" stop-opacity=".32"/><stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".48"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <circle cx="432" cy="76" r="126" fill="#C18CFF" opacity=".08"/>
  <g fill="#D9E7FF" opacity=".65"><circle cx="82" cy="92" r="2"/><circle cx="420" cy="414" r="2"/><circle cx="394" cy="104" r="1.5"/></g>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 142 78 256l112 114" stroke="#72B9FF" stroke-width="43"/>
    <path d="m322 142 112 114-112 114" stroke="#FF9BB0" stroke-width="43"/>
    <path d="M174 256h164" stroke="url(#accent)" stroke-width="34" filter="url(#softGlow)"/>
    <rect x="224" y="224" width="64" height="64" rx="17" transform="rotate(45 256 256)" fill="#111326" stroke="#D7C7FF" stroke-width="9"/>
    <path d="M256 231v50M231 256h50" stroke="#F5E9FF" stroke-width="7"/>
