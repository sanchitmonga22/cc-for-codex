<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">CC for Codex</title>
  <desc id="desc">Claude Code workflows inside Codex, connected by a luminous local bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080A14"/><stop offset=".54" stop-color="#12152A"/><stop offset="1" stop-color="#24152C"/></linearGradient>
    <linearGradient id="accent" x1="100" y1="0" x2="1060" y2="0"><stop stop-color="#62B5FF"/><stop offset=".5" stop-color="#9D8BFF"/><stop offset="1" stop-color="#FF8EA6"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(132 44) rotate(44) scale(310 260)"><stop stop-color="#4D8DFF" stop-opacity=".3"/><stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="400" rx="52" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="52" fill="url(#glow)"/>
  <circle cx="1094" cy="50" r="142" fill="#C18CFF" opacity=".08"/>
  <g filter="url(#shadow)"><rect x="62" y="58" width="1076" height="284" rx="28" fill="#0B0D19" fill-opacity=".78" stroke="#343754"/><rect x="62" y="58" width="1076" height="5" rx="2.5" fill="url(#accent)"/></g>
  <g transform="translate(112 105)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 20 16 95l62 75" stroke="#72B9FF" stroke-width="25"/>
    <path d="m194 20 62 75-62 75" stroke="#FF9BB0" stroke-width="25"/>
    <path d="M66 95h142" stroke="url(#accent)" stroke-width="20" filter="url(#softGlow)"/>
    <rect x="112" y="71" width="48" height="48" rx="13" transform="rotate(45 136 95)" fill="#111326" stroke="#D7C7FF" stroke-width="7"/>
    <path d="M136 78v34M119 95h34" stroke="#F5E9FF" stroke-width="5"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="438" y="166" fill="#F8F8FF" font-size="72" font-weight="750" letter-spacing="-.9">CC for Codex</text>
    <text x="442" y="221" fill="#C9CBE0" font-size="28">Claude Code workflows inside Codex.</text>
    <rect x="442" y="262" width="440" height="6" rx="3" fill="url(#accent)"/>
    <text x="442" y="304" fill="#8185A5" font-size="17" letter-spacing="1.1">LOCAL BRIDGE  ·  REVIEW  ·  DELEGATE  ·  VERIFY</text>
  </g>
</svg>
