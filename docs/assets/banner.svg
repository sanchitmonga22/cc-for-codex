      <path d="M250 23h90" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
      <path d="M326 10l17 13-17 13" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="366" width="224" height="46" rx="23" fill="#2b1814" stroke="#9a3412"/>
      <text x="478" y="30" fill="#fdba74" font-size="18" text-anchor="middle">CLAUDE CODE</text>
