    <rect x="84" y="73" width="1032" height="8" rx="4" fill="url(#accent)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="600" y="166" fill="#f9fafb" font-size="58" font-weight="700" text-anchor="middle">CC for Codex</text>
    <text x="600" y="218" fill="#d1d5db" font-size="23" text-anchor="middle">Claude Code reviews · isolated delegation · background sessions</text>
    <g transform="translate(311 258)">
      <rect width="224" height="46" rx="23" fill="#172033" stroke="#4b5563"/>
