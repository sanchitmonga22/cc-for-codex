<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CC for Codex</title>
  <desc id="desc">A luminous local bridge from Codex to Claude Code for reviews, delegation, and session management.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080A14"/><stop offset="0.52" stop-color="#12152A"/><stop offset="1" stop-color="#24152C"/></linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(126 54) rotate(45) scale(390 330)"><stop stop-color="#4D8DFF" stop-opacity=".32"/><stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1078 380) rotate(225) scale(430 320)"><stop stop-color="#A875FF" stop-opacity=".24"/><stop offset="1" stop-color="#A875FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="130" y1="0" x2="1080" y2="0"><stop stop-color="#62B5FF"/><stop offset=".5" stop-color="#9D8BFF"/><stop offset="1" stop-color="#FF8EA6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".46"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#blueGlow)"/>
  <rect width="1200" height="420" rx="30" fill="url(#violetGlow)"/>
  <g fill="#D9E7FF" opacity=".65"><circle cx="88" cy="65" r="2"/><circle cx="1010" cy="62" r="2"/><circle cx="1110" cy="104" r="1.5"/><circle cx="936" cy="340" r="1.5"/><circle cx="545" cy="55" r="1.5"/><circle cx="1150" cy="286" r="2"/></g>
  <g fill="none" stroke="#B9B7FF" opacity=".12"><ellipse cx="1035" cy="88" rx="154" ry="54" transform="rotate(-24 1035 88)"/><ellipse cx="1035" cy="88" rx="215" ry="76" transform="rotate(-24 1035 88)"/></g>
  <g filter="url(#shadow)"><rect x="64" y="54" width="1072" height="312" rx="26" fill="#0B0D19" fill-opacity=".82" stroke="#343754"/><rect x="64" y="54" width="1072" height="5" rx="2.5" fill="url(#accent)"/></g>
  <g transform="translate(126 116)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 18 12 92l64 74" stroke="#72B9FF" stroke-width="24"/>
    <path d="m196 18 64 74-64 74" stroke="#FF9BB0" stroke-width="24"/>
    <path d="M66 92h142" stroke="url(#accent)" stroke-width="20" filter="url(#softGlow)"/>
    <rect x="112" y="68" width="48" height="48" rx="13" transform="rotate(45 136 92)" fill="#111326" stroke="#D7C7FF" stroke-width="7"/>
    <path d="M136 75v34M119 92h34" stroke="#F5E9FF" stroke-width="5"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="448" y="164" fill="#F8F8FF" font-size="58" font-weight="750" letter-spacing="-.8">CC for Codex</text>
    <text x="450" y="210" fill="#C9CBE0" font-size="22">Claude Code workflows, safely orchestrated inside Codex.</text>
    <rect x="450" y="246" width="150" height="34" rx="17" fill="#151A33" stroke="#3D5C98"/>
    <text x="525" y="269" fill="#9CCBFF" font-size="14" font-weight="700" letter-spacing="1.8" text-anchor="middle">LOCAL BRIDGE</text>
    <rect x="616" y="246" width="198" height="34" rx="17" fill="#1C1730" stroke="#654D9F"/>
    <text x="715" y="269" fill="#D5C5FF" font-size="14" font-weight="700" letter-spacing="1.3" text-anchor="middle">READ-ONLY BY DEFAULT</text>
    <text x="450" y="326" fill="#8185A5" font-size="16">reviews  ·  delegation  ·  sessions  ·  verification</text>
  </g>
</svg>
